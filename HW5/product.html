<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HW5 - รายการสินค้า</title>
  <link rel="stylesheet" href="css/gridstyle.css">
</head>
<body>

  <header class="header">
    <img src="images/header.jpg" alt="AURA Acoustics Header">
  </header>

  <nav class="nav">
    <a href="index.html">หน้าหลัก </a>
    <a href="product.html">สินค้า </a>
  </nav>

  <div class="grid-container">
    
    <main class="main-content">
      <h2>รายการสินค้า</h2>
      
      <div class="product-gallery">
        <div class="product-card">
          <img src="images/product1.jpg" alt="Product 1">
          <div class="product-info">
            <h3>AURA Headphone Pro</h3>
            <p>หูฟังเกมมิ่งไร้สาย </p>
          </div>
        </div>

        <div class="product-card">
          <img src="images/product2.jpg" alt="Product 2">
          <div class="product-info">
            <h3>AURA Cyberpunk Edition</h3>
            <p>ดีไซน์ Cyberpunk </p>
          </div>
        </div>
      </div>
    </main>

    <aside class="sidebar">
      <h3>สมัครสมาชิก</h3>
      <form action="#" method="post">
        
        <div class="form-group">
          <label for="fname-p">ชื่อ</label>
          <input type="text" id="fname-p" name="fname" placeholder="ชื่อจริง" required>
        </div>

        <div class="form-group">
          <label for="lname-p">นามสกุล</label>
          <input type="text" id="lname-p" name="lname" placeholder="นามสกุล" required>
        </div>

        <div class="form-group">
          <label for="email-p">อีเมล</label>
          <input type="email" id="email-p" name="email" placeholder="example@domain.com" required>
        </div>

        <div class="form-group">
          <label for="password-p">รหัสผ่าน</label>
          <input type="password" id="password-p" name="password" placeholder="อย่างน้อย 8 ตัวอักษร" required>
        </div>

        <div class="form-group">
          <label for="confirm-password-p">ยืนยันรหัสผ่าน</label>
          <input type="password" id="confirm-password-p" name="confirm-password" placeholder="ยืนยันรหัสผ่าน" required>
        </div>

        <div class="form-group">
          <label for="phone-p">เบอร์โทรศัพท์</label>
          <input type="tel" id="phone-p" name="phone" placeholder="083-xxxx-xxxx" required>
        </div>

        <div class="form-group">
          <label>เพศ</label>
          <div class="radio-group-vertical">
            <label><input type="radio" name="gender" value="male" required> ชาย</label>
            <label><input type="radio" name="gender" value="female"> หญิง</label>
            <label><input type="radio" name="gender" value="unspecified"> ไม่ระบุ</label>
          </div>
        </div>

        <div class="form-group">
          <div class="checkbox-group-inline">
            <label><input type="checkbox" name="interests" value="news"> รับข่าวสาร</label>
            <label><input type="checkbox" name="interests" value="promo"> โปรโมชั่น</label>
            <label><input type="checkbox" name="interests" value="event"> กิจกรรม</label>
          </div>
        </div>

        <div class="form-group">
          <label for="member-type-p">ประเภทสมาชิก</label>
          <select id="member-type-p" name="member-type">
            <option value="ธรรมดา">ธรรมดา</option>
            <option value="VIP">VIP</option>
            <option value="Premium">Premium</option>
          </select>
        </div>

        <div class="form-group">
          <label class="terms-label">
            <input type="checkbox" name="terms" required> ยอมรับข้อกำหนดและเงื่อนไข
          </label>
        </div>

        <button type="submit" class="submit-btn-blue">สมัครสมาชิก</button>
        <p class="privacy-note">เราจะเก็บข้อมูลของคุณเป็นความลับ</p>
      </form>
    </aside>

  </div>

  <footer class="footer">
    <img src="images/footer.jpg" alt="AURA Acoustics Footer">
  </footer>

</body>
</html>
